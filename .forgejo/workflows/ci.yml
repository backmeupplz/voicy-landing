name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Linux starts from a fresh container: keep npx's install of html-validate (the Mac runners keep theirs)
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-html-validate-11.16.2
      # .htmlvalidate.json: the recommended rules minus the two style-only ones (<meta/> and <!doctype>)
      - run: npx --yes html-validate@11.16.2 site/*.html
